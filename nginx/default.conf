map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream cms_upstream {
  server cms:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 25m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /admin {
    proxy_pass http://cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location /api/media/file/ {
    alias /srv/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri @cms;
  }

  location /api {
    proxy_pass http://cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @cms {
    proxy_pass http://cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /_payload-admin {
    proxy_pass http://cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* ^/_astro/.+\.(?:js|css|woff2?|svg)$ {
    root /srv/web;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
    root /srv/web;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
  }

  location / {
    root /srv/web;
    try_files $uri $uri/index.html $uri.html /404.html;
    add_header Cache-Control "public, max-age=300";
  }
}
